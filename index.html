
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nocturne Calculator</title>

    <link rel="stylesheet" href="Kalkulator.css">
</head>

<body>

    <!-- STAR BACKGROUND -->
    <div class="stars"></div>

    <!-- MAIN CALCULATOR -->
    <main class="calculator">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>Nocturne <span>✦</span></h1>
                <p>your little cosmic calculator</p>
            </div>

            <button
                id="historyToggle"
                class="icon-btn"
                title="History"
            >
                ◷
            </button>
        </header>


        <!-- THEME PICKER -->
        <div class="theme-picker">

            <span class="theme-label">
                CHOOSE YOUR UNIVERSE
            </span>

            <div class="theme-options">

                <button
                    class="theme-btn"
                    data-theme="lavender"
                    title="Lavender"
                    aria-label="Lavender theme"
                >
                    <span class="theme-dot lavender-dot"></span>
                </button>

                <button
                    class="theme-btn"
                    data-theme="midnight"
                    title="Midnight Blue"
                    aria-label="Midnight Blue theme"
                >
                    <span class="theme-dot midnight-dot"></span>
                </button>

                <button
                    class="theme-btn"
                    data-theme="light"
                    title="Yellow"
                    aria-label="Light Yellow theme"
                >
                    <span class="theme-dot light-dot"></span>
                </button>

                <button
                    class="theme-btn"
                    data-theme="matcha"
                    title="Matcha"
                    aria-label="Matcha Green theme"
                >
                    <span class="theme-dot matcha-dot"></span>
                </button>

            </div>
        </div>


        <!-- DISPLAY -->
        <section class="display">

            <div class="display-top">
                <span id="modeLabel">BASIC MODE</span>
                <span id="angleMode">DEG</span>
            </div>

            <div id="expression"></div>

            <input
                id="layar"
                type="text"
                value="0"
                readonly
                aria-label="Calculator display"
            >

        </section>


        <!-- TOOLBAR -->
        <div class="toolbar">

            <button
                id="modeToggle"
                class="tool-btn"
            >
                SCI MODE
            </button>

            <button
                id="angleToggle"
                class="tool-btn"
            >
                DEG
            </button>

        </div>


        <!-- SCIENTIFIC KEYS -->
        <section
            id="scientificKeys"
            class="scientific-keys hidden"
        >

            <button data-value="sin(">sin</button>
            <button data-value="cos(">cos</button>
            <button data-value="tan(">tan</button>
            <button data-value="log(">log</button>
            <button data-value="ln(">ln</button>

            <button data-value="sqrt(">√</button>
            <button data-action="square">x²</button>
            <button data-value="^">xʸ</button>
            <button data-value="!">x!</button>
            <button data-value="pi">π</button>

            <button data-value="e">e</button>
            <button data-value="abs(">abs</button>
            <button data-value="(">(</button>
            <button data-value=")">)</button>
            <button data-value="%">mod</button>

        </section>


        <!-- MEMORY KEYS -->
        <section class="memory-keys">

            <button data-memory="MC">MC</button>
            <button data-memory="MR">MR</button>
            <button data-memory="M+">M+</button>
            <button data-memory="M-">M-</button>

        </section>


        <!-- MAIN KEYPAD -->
        <section class="keys">

            <button
                class="clear"
                data-action="clear"
            >
                AC
            </button>

            <button
                class="delete"
                data-action="delete"
            >
                DEL
            </button>

            <button
                class="operator"
                data-value="("
            >
                (
            </button>

            <button
                class="operator"
                data-value=")"
            >
                )
            </button>


            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>

            <button
                class="operator"
                data-value="/"
            >
                ÷
            </button>


            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>

            <button
                class="operator"
                data-value="*"
            >
                ×
            </button>


            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>

            <button
                class="operator"
                data-value="-"
            >
                −
            </button>


            <button data-value="0">0</button>
            <button data-value="00">00</button>
            <button data-value=".">.</button>

            <button
                class="operator"
                data-value="+"
            >
                +
            </button>


            <button
                class="equals"
                data-action="calculate"
            >
                =
            </button>

        </section>


        <!-- HISTORY PANEL -->
        <aside
            id="historyPanel"
            class="history-panel hidden"
        >

            <div class="history-header">

                <h2>Calculation History</h2>

                <button id="clearHistory">
                    Clear
                </button>

            </div>

            <div id="historyList">

                <p class="empty-history">
                    No calculations yet.
                </p>

            </div>

        </aside>


        <!-- FOOTER -->
        <footer>
            ✦ made by clive ✦
        </footer>

    </main>


    <!-- JAVASCRIPT -->
    <script src="Kalkulator.js"></script>

</body>
</html>
